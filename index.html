<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingeniería en Telecomunicaciones - UNSA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .malla { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .anio { background: #fff; border: 1px solid #ccc; border-radius: 8px; min-width: 250px; padding: 10px; }
        .anio h3 { text-align: center; margin-top: 0; background: #003366; color: white; padding: 8px; border-radius: 4px; }
        .semestre h4 { background: #e0e0e0; padding: 5px; margin: 10px 0 5px 0; font-size: 14px; text-align: center; }
        .curso { background: #fdfdfd; border: 1px solid #ddd; padding: 8px; border-radius: 4px; margin-bottom: 6px; font-size: 12px; }
        .curso-header { display: flex; justify-content: space-between; font-weight: bold; }
        .prq { color: #888; font-size: 10px; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Ingeniería en Telecomunicaciones - UNSA</h2>
        <div>
            <label for="selectPlan">Seleccionar Plan: </label>
            <select id="selectPlan" onchange="renderizarPlan(this.value)">
                <option value="2017">Plan 2017</option>
                <option value="2025" selected>Plan 2025</option>
            </select>
        </div>
    </div>

    <div id="mallaContainer" class="malla"></div>

    <script src="data.js"></script>
    <script>
        function renderizarPlan(planKey) {
            const container = document.getElementById("mallaContainer");
            container.innerHTML = "";

            const plan = planesEstudio[planKey];
            if (!plan) return;

            plan.anios.forEach(anio => {
                const divAnio = document.createElement("div");
                divAnio.className = "anio";
                divAnio.innerHTML = `<h3>${anio.numero}</h3>`;

                anio.semestres.forEach(semestre => {
                    const divSemestre = document.createElement("div");
                    divSemestre.className = "semestre";
                    divSemestre.innerHTML = `<h4>${semestre.nombre}</h4>`;

                    semestre.cursos.forEach(curso => {
                        const divCurso = document.createElement("div");
                        divCurso.className = "curso";
                        const prqText = curso.prq.length > 0 ? `Prerreq: ${curso.prq.join(", ")}` : "Sin prerrequisito";
                        divCurso.innerHTML = `
                            <div class="curso-header">
                                <span>${curso.nombre}</span>
                                <span>[${curso.cred} cr]</span>
                            </div>
                            <div class="prq">Cód: ${curso.codigo} | ${prqText}</div>
                        `;
                        divSemestre.appendChild(divCurso);
                    });

                    divAnio.appendChild(divSemestre);
                });

                container.appendChild(divAnio);
            });
        }

        // Cargar por defecto el plan 2025 al iniciar
        document.addEventListener("DOMContentLoaded", () => {
            renderizarPlan("2025");
        });
    </script>
</body>
</html>
