<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repositorio Telecom UNSA</title>
  <style>
    :root {
      --unsa-red: #6b1d2f;
      --unsa-red-hover: #501321;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
    }
    header {
      background: var(--unsa-red);
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
    }
    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 5px 0 0; font-size: 0.95rem; opacity: 0.9; }

    /* Pestañas de Malla */
    .malla-selector {
      display: flex;
      justify-content: center;
      background: #e0e0e0;
      border-bottom: 2px solid #ccc;
    }
    .malla-btn {
      padding: 12px 24px;
      font-weight: bold;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1rem;
      color: #555;
    }
    .malla-btn.active {
      background: var(--card-bg);
      color: var(--unsa-red);
      border-bottom: 3px solid var(--unsa-red);
    }

    /* Pestañas de Semestres */
    .semestre-selector {
      display: flex;
      overflow-x: auto;
      background: var(--card-bg);
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .sem-btn {
      background: #f0f0f0;
      border: 1px solid #ddd;
      padding: 8px 14px;
      margin-right: 8px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      color: #444;
    }
    .sem-btn.active {
      background: var(--unsa-red);
      color: white;
      border-color: var(--unsa-red);
    }

    main { padding: 20px; max-width: 1200px; margin: auto; }
    .section-title { color: var(--unsa-red); border-bottom: 2px solid var(--unsa-red); padding-bottom: 5px; margin-bottom: 20px; }

    /* Card Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 4px solid var(--unsa-red);
    }
    .card-header { margin-bottom: 10px; }
    .card-code { font-size: 0.75rem; color: #777; font-weight: bold; }
    .card-title { font-size: 1.05rem; margin: 4px 0; color: #111; font-weight: bold; }
    .card-info { font-size: 0.85rem; color: #555; margin-bottom: 12px; }
    .card-info span { display: block; margin-top: 3px; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-drive {
      flex: 1;
      text-align: center;
      padding: 6px 10px;
      background: var(--unsa-red);
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .btn-drive:hover { background: var(--unsa-red-hover); }
  </style>
</head>

    let mallaActual = "2017";

    function init() {
      renderSemestresNav();
      renderCursos();
    }

    function renderSemestresNav() {
      const nav = document.getElementById("semestreNav");
      nav.innerHTML = "";
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement("button");
        btn.className = `sem-btn ${i === semestreActual ? 'active' : ''}`;
        btn.innerText = `${i}° Semestre`;
        btn.onclick = () => seleccionarSemestre(i);
        nav.appendChild(btn);
      }
    }

    function seleccionarSemestre(sem) {
      semestreActual = sem;
      renderSemestresNav();
      renderCursos();
    }

    function cambiarMalla(malla) {
      mallaActual = malla;
      document.querySelectorAll('.malla-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCursos();
    }

    function renderCursos() {
      const grid = document.getElementById("cursosGrid");
      const titulo = document.getElementById("tituloSemestre");
      titulo.innerText = `${semestreActual}° Semestre - Malla ${mallaActual}`;
      grid.innerHTML = "";

      let cursos = [];
      if (mallaActual === "2017") {
        cursos = malla2017[semestreActual] || [];
      } else {
        grid.innerHTML = "<p>Próximamente disponible el mapa de la Malla 2025.</p>";
        return;
      }

      cursos.forEach(c => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <span class="card-code">${c.cod}</span>
            <div class="card-title">${c.nom}</div>
            <div class="card-info">
              <span><strong>Créditos:</strong> ${c.cred}</span>
              <span><strong>Prerrequisito:</strong> ${c.prq}</span>
            </div>
          </div>
          <div class="btn-group">
            <a href="#" class="btn-drive" target="_blank">Drive Material</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    init();
